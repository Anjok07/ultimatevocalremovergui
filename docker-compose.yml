# UVR web service — CPU-only deployment.
#   docker compose up --build
# Then open http://localhost:8400
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      # The web container talks to the API server-side; browser hits it via the
      # nginx /api proxy, so wide-open CORS is unnecessary but harmless here.
      UVR_CORS_ORIGINS: "*"
      UVR_DATA_DIR: /data
      # Cap inference threads (also caps per-thread memory). See api/separation.py.
      UVR_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    volumes:
      # Persist downloaded model weights and job inputs/outputs across restarts.
      - ./models:/app/models
      - uvr-data:/data
    # Separation is CPU/RAM heavy. Cap container memory so one large job can't
    # trigger a host-wide OOM that kills OTHER services on this box — the cgroup
    # contains the kill to this container, which then restarts on its own.
    # Tune to the host; ~4G fits a typical song with the lean ORT settings.
    # (deploy.resources form, not legacy mem_limit, so the GPU overlay's device
    # reservation merges cleanly — see docker-compose.gpu.yml.)
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          memory: 1g
    restart: unless-stopped

  web:
    build:
      context: ./web
    ports:
      # Localhost only; fronted by Caddy at dabba.princesamuel.me/uvr.
      - "127.0.0.1:8400:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  uvr-data:
