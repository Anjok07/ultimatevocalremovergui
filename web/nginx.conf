server {
    listen 80;
    server_name _;

    # Audio uploads can be large.
    client_max_body_size 512m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + file downloads to the backend service.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;   # separations can take minutes
        proxy_send_timeout 3600s;

        # Stream bodies directly instead of buffering to temp files. Without
        # this, large stem downloads (and audio uploads) are spooled to
        # /var/cache/nginx; if the host disk is full those writes fail and the
        # transfer truncates. Streaming also lowers latency.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
